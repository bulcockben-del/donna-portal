<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="container">

<div class="top-bar">
    <button
    class="logout-btn"
    onclick="logout()">
        Logout
    </button>
</div>

<div class="card">

<h1>Admin Panel</h1>

<button
onclick="window.location.href='/create-admin.html'">

Create Staff Admin

</button>

<p>
Manage customer minutes and memberships.
</p>

</div>

<div class="card">

<h2>Clients</h2>

<input
id="search"
type="text"
placeholder="Search client..."
onkeyup="renderUsers()">

<div id="clients"></div>>

</div>

</div>

<script>

const user = JSON.parse(
    localStorage.getItem("user")
);

if(
    !user ||
    user.role !== "admin"
){

    window.location.href =
    "/login.html";

}

let allUsers = [];

let selectedUser = null;

fetch("/users")
.then(res=>res.json())
.then(users=>{

    allUsers = users;

    renderUsers();

});

function renderUsers(){

    const search =
    document.getElementById("search")
    .value
    .toLowerCase();

    let html = "";

    allUsers.forEach(user=>{

        if(
            user.role === "client" &&
            user.name
            .toLowerCase()
            .includes(search)
        ){

            html += `
            <div class="client">

                <div>

                    <strong>${user.name}</strong>

                    <p>
                    ${user.minutes} Minutes
                    </p>

                </div>

                <div class="controls">

                    <input
                    id="minutes-${user.id}"
                    type="number"
                    placeholder="Minutes">

                    <button onclick="
                    addMinutes(${user.id})
                    ">
                    Add
                    </button>

                    <button
                    class="remove-btn"
                    onclick="
                    removeMinutes(${user.id})
                    ">
                    Remove
                    </button>

                    <button onclick="viewProfile(${user.id})">
                    Profile
                    </button>

                </div>

            </div>
            `;

        }

    });

    document.getElementById("clients")
    .innerHTML = html;

}

function addMinutes(id){

    const minutes = parseInt(
        document.getElementById(
            `minutes-${id}`
        ).value
    );

    if(!minutes) return;

    fetch("/add-minutes",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            id:id,
            minutes:minutes

        })

    })

    .then(()=>location.reload());

}

function removeMinutes(id){

    const minutes = parseInt(
        document.getElementById(
            `minutes-${id}`
        ).value
    );

    if(!minutes) return;

    fetch("/add-minutes",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            id:id,
            minutes:-minutes

        })

    })

    .then(()=>location.reload());

}

function viewProfile(id){

    const user = allUsers.find(
        u => u.id === id
    );

    selectedUser = user;

    document.getElementById(
        "profileName"
    ).innerText =
    user.name;

    document.getElementById(
        "profileEmail"
    ).innerText =
    user.email;

    document.getElementById(
        "profileMinutes"
    ).innerText =
    user.minutes;

    document.getElementById(
        "profilePhone"
    ).innerText =
    user.phone || "Not provided";

    document.getElementById(
        "profileDob"
    ).innerText =
    user.dob || "Not provided";

    document.getElementById(
        "profileSkinType"
    ).innerText =
    user.skinType || "Not provided";

    document.getElementById(
        "profileLastSession"
    ).innerText =
    user.lastAppointment || "Never";

    document.getElementById(
        "profileLastMinutes"
    ).innerText =
    user.lastAppointmentMinutes || 0;

    document.getElementById(
        "profileNotes"
    ).innerText =
    user.notes || "None";

    document.getElementById(
        "profileModal"
    ).style.display =
    "flex";

}

function closeProfile(){

    document.getElementById(
        "profileModal"
    ).style.display =
    "none";

}

function viewHistory(){

    let html = "";

    if(
        !selectedUser ||
        !selectedUser.history ||
        selectedUser.history.length === 0
    ){

        html =
        "<p>No session history found.</p>";

    }
    else{

        selectedUser.history
        .slice()
        .reverse()
        .forEach(session=>{

            html += `

            <div class="history-item">

                <div class="history-date">
                    ${session.date}
                </div>

                <div class="history-minutes">
                    ${session.minutes} Minutes
                </div>

            </div>

            `;

        });

    }

    document.getElementById(
        "historyList"
    ).innerHTML = html;

    document.getElementById(
        "historyModal"
    ).style.display = "flex";

}

function closeHistory(){

    document.getElementById(
        "historyModal"
    ).style.display = "none";

}

function recordSession(minutes){

    if(!selectedUser){

        return;

    }

    fetch("/use-session",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            id:selectedUser.id,
            minutes:minutes

        })

    })

    .then(res=>res.json())

    .then(data=>{

        if(data.success === false){

            alert(
                data.message
            );

            return;

        }

        alert(
            "Session recorded."
        );

        location.reload();

    });

}

function recordCustomSession(){

    const minutes = parseInt(

        document.getElementById(
            "customSessionMinutes"
        ).value

    );

    if(!minutes){

        alert(
            "Enter minutes."
        );

        return;

    }

    recordSession(minutes);

}

function logout(){

    localStorage.removeItem(
        "user"
    );

    window.location.href =
    "/login.html";

}

</script>

<div id="profileModal" class="modal">

    <div class="modal-content">

        <span
        class="close"
        onclick="closeProfile()">
            &times;
        </span>

        <h2 id="profileName"></h2>

        <p>
            <strong>Email:</strong>
            <span id="profileEmail"></span>
        </p>

        <p>
            <strong>Minutes:</strong>
            <span id="profileMinutes"></span>
        </p>

        <p>
            <strong>Last Session:</strong>
            <span id="profileLastSession"></span>
        </p>

        <p>
            <strong>Phone:</strong>
            <span id="profilePhone"></span>
        </p>

        <p>
            <strong>Date Of Birth:</strong>
            <span id="profileDob"></span>
        </p>

        <p>
            <strong>Skin Type:</strong>
            <span id="profileSkinType"></span>
        </p>

        <p>
            <strong>Minutes Used:</strong>
            <span id="profileLastMinutes"></span>
        </p>

        <h3>Record Session</h3>

    <div class="session-buttons">

        <button onclick="recordSession(3)">
            3
        </button>

        <button onclick="recordSession(6)">
            6
        </button>

        <button onclick="recordSession(9)">
            9
        </button>

        <button onclick="recordSession(12)">
            12
        </button>

        <button onclick="recordSession(15)">
            15
        </button>

    </div>

    <input
    id="customSessionMinutes"
    type="number"
    placeholder="Custom Minutes">

    <button
    onclick="recordCustomSession()">

    Record Custom Session

    </button>

        <p>
            <strong>Client Notes:</strong>
        </p>

        <p id="profileNotes"></p>

        <button
            onclick="viewHistory()">

            View Full History

        </button>

    </div>

</div>

<div id="historyModal" class="modal">

    <div class="modal-content">

        <span
        class="close"
        onclick="closeHistory()">
            &times;
        </span>

        <h2>Session History</h2>

        <div id="historyList"></div>

    </div>

</div>

</body>

</html>
