<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Client Portal</title>

<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="top-bar">

    <a
    href="/index.html"
    class="back-btn">

        ← Back to Website

    </a>

</div>

<div class="login-card">

<h1>Client Portal</h1>

<input
id="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<p class="register-link">
    Not a member yet?
    <a href="/register.html">Create Account</a>
</p>

</div>

<script>

function login(){

    fetch("/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            email:
            document.getElementById("email").value,

            password:
            document.getElementById("password").value

        })

    })

    .then(res=>res.json())

    .then(data=>{

        if(data.success){

            localStorage.setItem(
            "user",
            JSON.stringify(data.user)
            );

            if(data.role === "admin"){

                window.location.href =
                "/admin.html";

            }
            else{

                window.location.href =
                "/dashboard.html";

            }

        }
        else{

            alert("Wrong login");

        }

    });

}

</script>

</body>
</html>
