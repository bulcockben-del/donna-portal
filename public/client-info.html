<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Client Information</title>

<link rel="stylesheet" href="register.css">

</head>

<body>

<div class="register-card">

<h1>Client Information</h1>

<input
id="phone"
type="tel"
placeholder="Phone Number"
required>

<label>Date Of Birth</label>
<input
id="dob"
type="date"
class="mobile-date"
required>

<label>Skin Type</label>

<select id="skinType">

<option>Sensitive</option>
<option>Fair</option>
<option>Medium</option>
<option>Dark</option>

</select>

<label>
Notes / Allergies
</label>

<textarea
id="notes"
placeholder="Any allergies, skin sensitivities or preferences">
</textarea>

<label class="terms">

<input
type="checkbox"
id="over18">

I confirm I am over 18 years old

</label>

<label class="terms">

<input
type="checkbox"
id="safety">
I have read and understand the
<a href="/safety.html" target="_blank">
sunbed safety information
</a>

</label>

<button onclick="completeRegistration()">

Complete Registration

</button>

</div>

<script>

function completeRegistration(){

    const phone =
    document.getElementById(
        "phone"
    ).value.trim();

    const dob =
    document.getElementById(
        "dob"
    ).value;

    const skinType =
    document.getElementById(
        "skinType"
    ).value;

    if(!phone){

    alert(
        "Please enter a phone number."
    );

    return;

    }

    if(!dob){

        alert(
            "Please enter your date of birth."
        );

        return;

    }

    if(!skinType){

        alert(
            "Please select a skin type."
        );

        return;

    }

    const user = JSON.parse(
        localStorage.getItem(
            "pendingUser"
        )
    );

    if(
        !document.getElementById(
            "over18"
        ).checked
    ){

        alert(
            "Please confirm you are over 18."
        );

        return;

    }

    if(
        !document.getElementById(
            "safety"
        ).checked
    ){

        alert(
            "Please confirm the safety information."
        );

        return;

    }

    fetch("/register",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            name:user.name,
            email:user.email,
            password:user.password,

            phone:
            document.getElementById(
                "phone"
            ).value,

            dob:
            document.getElementById(
                "dob"
            ).value,

            skinType:
            document.getElementById(
                "skinType"
            ).value,

            notes:
            document.getElementById(
                "notes"
            ).value,

            over18:true,

            safetyAccepted:true

        })

    })

    .then(res=>res.json())

    .then(data=>{

        if(!data.success){

            alert(
                data.message
            );

            return;

        }

        localStorage.removeItem(
            "pendingUser"
        );

        alert(
            "Account Created!"
        );

        window.location.href =
        "/login.html";

    });

}

</script>

</body>

</html>
